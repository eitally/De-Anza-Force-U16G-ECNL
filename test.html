<!DOCTYPE html>
<html>
<head>
<style>
  .modal {
    width: 300px;
    height: 300px;
    border-radius: 24px;
    background: white;
    overflow: hidden;
    transform: scale(1);
    border: 1px solid blue;
  }
  .bar {
    height: 8px;
    background: linear-gradient(to right, blue, red);
  }
</style>
</head>
<body>
  <div class="modal">
    <div class="bar"></div>
  </div>
</body>
</html>
