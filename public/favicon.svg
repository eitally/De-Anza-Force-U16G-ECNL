<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1836" />
      <stop offset="50%" stop-color="#0d244f" />
      <stop offset="100%" stop-color="#060c18" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADEF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Shield Base -->
  <path
    d="M 50,4 
       C 84,4 94,14 94,36 
       C 94,76 68,104 50,116 
       C 32,104 6,76 6,36 
       C 6,14 16,4 50,4 Z"
    fill="url(#shieldGrad)"
    stroke="#00ADEF"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Red Accent Chevron -->
  <path
    d="M 22,22 L 78,22 L 50,46 Z"
    fill="#dc2626"
    opacity="0.9"
  />

  <!-- Dynamic Cyan Stripe -->
  <path
    d="M 12,38 L 88,38 L 50,78 Z"
    fill="url(#cyanGrad)"
    opacity="0.85"
  />

  <!-- Soccer Ball / Force Star Icon -->
  <polygon
    points="50,48 55,62 70,62 58,72 62,86 50,77 38,86 42,72 30,62 45,62"
    fill="#ffffff"
  />
</svg>
